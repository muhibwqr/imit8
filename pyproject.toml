[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imit8"
version = "0.1.0"
description = "A local computer-use agent that remembers the flows you run"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pyautogui>=0.9.54",
    "pillow>=10.0",
    "mss>=9.0",
    "PySide6>=6.6",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
imit8 = "imit8.cli:main"

[tool.setuptools.packages.find]
include = ["imit8*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
